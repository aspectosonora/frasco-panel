<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<title>FRASCO · Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0D0B; --panel:#14160F; --panel2:#1A1D14; --line:#262A1E;
  --cream:#F0EDE4; --muted:#8E948A; --lime:#8FE231; --lime-deep:#6FAE1F;
  --rojo:#E25B4A; --ambar:#E2B331; --azul:#7EC8E3;
  --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
::selection{background:var(--lime);color:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line)}
header img{height:26px;display:block}
.who{display:flex;align-items:center;gap:10px}
.who span{font-family:var(--disp);font-size:13px;color:var(--muted)}
.who b{color:var(--cream);font-weight:600}

nav{display:flex;gap:4px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{font-family:var(--disp);font-size:14px;font-weight:500;background:none;border:1px solid transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{background:var(--lime);color:var(--bg);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

main{padding:20px 18px 40px;max-width:760px;margin:0 auto}
section[hidden]{display:none}
h1{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.lead{color:var(--muted);font-size:14px;margin:6px 0 18px}

.btn{font-family:var(--disp);font-size:14px;font-weight:600;background:var(--lime);color:var(--bg);border:none;padding:10px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--cream)}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}

input,select,textarea{font-family:var(--body);font-size:15px;background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 12px;width:100%}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--disp);font-size:13px;color:var(--muted);margin-bottom:5px}

/* ---- semana ---- */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.weekbar b{font-family:var(--disp);font-size:15px;flex:1;text-align:center}
.tally{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--disp);font-size:14px;color:var(--muted);margin-bottom:20px}
.tally b{font-size:22px;color:var(--cream);margin-right:4px}
.tally .hot b{color:var(--rojo)}
.tally .ok b{color:var(--lime)}

.shotlist{border:1px solid #5a241d;background:#1c110e;border-radius:14px;padding:14px 16px;margin-bottom:22px}
.shotlist h2{font-family:var(--disp);font-size:16px;color:var(--rojo);margin-bottom:6px}
.shotlist li{list-style:none;padding:7px 0;border-top:1px solid #3a1d17;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.shotlist li:first-of-type{border-top:none}
.shotlist small{color:var(--muted)}

.day{margin-bottom:22px}
.dayhead{font-family:var(--disp);font-size:15px;font-weight:600;display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dayhead.today{color:var(--lime)}
.dayhead small{color:var(--muted);font-weight:400}

.task{display:grid;grid-template-columns:5px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.task .rail{background:var(--muted)}
.task .body{padding:12px 14px}
.task .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task h3{font-family:var(--disp);font-size:16px;font-weight:600;line-height:1.3}
.task .meta{font-size:13px;color:var(--muted);margin-top:3px}
.task .cli{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.time{font-family:var(--disp);font-weight:600;color:var(--lime);white-space:nowrap;font-size:14px}
.task .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.julio-note{margin-top:10px;font-size:13px;background:#2a1612;border:1px solid #5a241d;color:#f3c1b9;padding:8px 10px;border-radius:8px}
.my-note{margin-top:8px;font-size:13px;color:var(--muted)}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:none;border-radius:8px;padding:8px 4px;font-family:var(--disp);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.2}
.seg button[aria-pressed="true"]{color:var(--bg)}
.seg button[data-s="sin_material"][aria-pressed="true"]{background:var(--rojo)}
.seg button[data-s="grabado"][aria-pressed="true"]{background:var(--azul)}
.seg button[data-s="edicion"][aria-pressed="true"]{background:var(--ambar)}
.seg button[data-s="revision"][aria-pressed="true"]{background:var(--lime)}
.locked{margin-top:12px;font-family:var(--disp);font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;background:var(--lime);color:var(--bg)}

/* ---- marcas / drive ---- */
.rootlink{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--lime-deep);border-radius:14px;padding:16px;margin-bottom:18px;text-decoration:none}
.rootlink b{font-family:var(--disp);font-size:16px;display:block}
.rootlink div span{font-size:13px;color:var(--muted)}
details.brand{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.brand summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details.brand summary::-webkit-details-marker{display:none}
details.brand summary b{font-family:var(--disp);font-size:15px;flex:1}
details.brand summary small{color:var(--muted);font-size:12px}
details.brand[open] summary{border-bottom:1px solid var(--line)}
.brandbody{padding:12px 14px 14px;font-size:14px}
.brandbody dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin-bottom:12px}
.brandbody dt{color:var(--muted);font-size:13px}
.brandbody dd.no{color:#f3c1b9}

/* ---- ideas ---- */
.idea{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.idea .fmt{font-family:var(--disp);font-size:12px;color:var(--lime)}
.idea h3{font-family:var(--disp);font-size:16px;margin:4px 0 6px}
.idea p{font-size:14px;color:var(--muted)}
.idea p b{color:var(--cream);font-weight:500}
.idea .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sent{font-family:var(--disp);font-size:13px;color:var(--lime);align-self:center}

.empty{color:var(--muted);font-size:14px;padding:18px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--lime);color:var(--bg);font-family:var(--disp);font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px;z-index:99}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--disp);font-size:20px;margin-bottom:12px}
.sheet h4{font-family:var(--disp);font-size:13px;color:var(--lime);margin:14px 0 4px}
.sheet p{white-space:pre-wrap;line-height:1.6}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}

#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-card{width:100%;max-width:340px;text-align:center}
.login-card img{height:38px;margin-bottom:10px}
.login-card p{color:var(--muted);font-family:var(--disp);font-size:14px;margin-bottom:24px}
.login-card .field{text-align:left}
.login-err{color:var(--rojo);font-size:13px;margin-top:10px;min-height:18px}
#boot{padding:40px 18px;color:var(--muted);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="frasco-logo" alt="FRASCO Creative Office">
  <div class="who"><span>Producción · <b id="whoName">—</b></span><button class="btn ghost sm" id="logoutBtn">Salir</button></div>
</header>
<nav aria-label="Secciones">
  <button data-v="semana" aria-current="page">Mi semana</button>
  <button data-v="marcas">Clientes y Drive</button>
  <button data-v="ideas">Ideas IA</button>
</nav>
<main>
  <div id="boot">Cargando tu semana…</div>
  <section id="v-semana" hidden></section>
  <section id="v-marcas" hidden></section>
  <section id="v-ideas" hidden></section>
</main>
<div id="modalRoot"></div>

<div id="loginScreen" style="display:none">
  <div class="login-card">
    <img class="frasco-logo" alt="FRASCO Creative Office">
    <p>Panel de producción</p>
    <div class="field"><label for="lg_email">Correo</label><input id="lg_email" type="email" autocomplete="username"></div>
    <div class="field"><label for="lg_pass">Contraseña</label><input id="lg_pass" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%;justify-content:center" id="lg_btn">Entrar</button>
    <div class="login-err" id="lg_err"></div>
  </div>
</div>

<script>
// reutiliza el logo del panel principal (misma fuente, sin archivo extra)
fetch('/',{cache:'force-cache'}).then(r=>r.text()).then(t=>{const m=t.match(/_logoSrc = '(data:image\/png;base64,[^']+)'/);if(m)document.querySelectorAll('.frasco-logo').forEach(i=>i.src=m[1]);}).catch(()=>{});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const OWNER_EMAIL='yuliushc@gmail.com';
const app=initializeApp({
  apiKey:"AIzaSyCMOorpDurNhs7b28buNM1v_YNNdSBdgNk",
  authDomain:"frasco-panel.firebaseapp.com",
  projectId:"frasco-panel",
  storageBucket:"frasco-panel.firebasestorage.app",
  messagingSenderId:"470941056023",
  appId:"1:470941056023:web:a8dd868d3ed7a12382b052"
});
const auth=getAuth(app), db=getFirestore(app);

/* ---------- estado ---------- */
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_C=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const FLOW=[
  {s:'sin_material',l:'Falta grabar',c:'var(--rojo)'},
  {s:'grabado',l:'Grabado',c:'var(--azul)'},
  {s:'edicion',l:'Editando',c:'var(--ambar)'},
  {s:'revision',l:'Listo',c:'var(--lime)'}
];
const RAIL={sin_material:'var(--rojo)',grabado:'var(--azul)',edicion:'var(--ambar)',revision:'var(--lime)',aprobado:'var(--lime)',corregir:'var(--rojo)'};
let B=null, E={}, P={}, user=null, view='semana', weekStart=getMonday(new Date()), ideas=[], unsub=[];

function getMonday(d){d=new Date(d);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);d.setHours(0,0,0,0);return d;}
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtHora(h){return h<12?h+':00 am':h===12?'12:00 pm':(h-12)+':00 pm';}
function cli(id){return (B&&B.clientes||[]).find(c=>c.id===id);}
function est(id){return E[id]||{};}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;t.setAttribute('role','status');document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
// el panel de Julio guarda la semana como ISO UTC del lunes; aceptamos ambas variantes
function sameWeek(t,ws){const a=iso(ws);const b=new Date(ws);b.setHours(12);const c=b.toISOString().slice(0,10);return t.week===a||t.week===c;}

/* ---------- vistas ---------- */
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  view=b.dataset.v;
  document.querySelectorAll('nav button').forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));
  render();
});
function render(){
  if(!B)return;
  document.getElementById('boot').hidden=true;
  ['semana','marcas','ideas'].forEach(v=>document.getElementById('v-'+v).hidden=v!==view);
  if(view==='semana')rSemana();
  if(view==='marcas')rMarcas();
  if(view==='ideas')rIdeas();
}

function rSemana(){
  const tareas=(B.tareas||[]).filter(t=>sameWeek(t,weekStart));
  const fin=new Date(weekStart);fin.setDate(fin.getDate()+6);
  const f=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const hoy=new Date();const esEsta=iso(getMonday(hoy))===iso(weekStart);const hoyDia=(hoy.getDay()+6)%7;
  const listas=tareas.filter(t=>['revision','aprobado'].includes(est(t.id).estado)).length;
  const faltan=tareas.filter(t=>est(t.id).estado==='sin_material');
  const correc=tareas.filter(t=>est(t.id).estado==='corregir').length;
  const porDia=DIAS.map((_,i)=>tareas.filter(t=>t.dia===i).sort((a,b)=>(a.hora??99)-(b.hora??99)));

  document.getElementById('v-semana').innerHTML=`
  <h1>${esEsta?'Esta semana':'Semana del '+f(weekStart)}</h1>
  <p class="lead">Marca cada video conforme avanza: Falta grabar, Grabado, Editando o Listo. Julio lo ve al momento y te aprueba o te pide cambios.</p>
  <div class="weekbar">
    <button class="btn ghost sm" data-act="wk" data-n="-1" aria-label="Semana anterior">←</button>
    <b>${f(weekStart)} – ${f(fin)}</b>
    <button class="btn ghost sm" data-act="wk" data-n="1" aria-label="Semana siguiente">→</button>
  </div>
  ${tareas.length?`<div class="tally">
    <span><b>${tareas.length}</b>videos</span>
    <span class="ok"><b>${listas}</b>listos</span>
    <span class="hot"><b>${faltan.length}</b>falta grabar</span>
    ${correc?`<span class="hot"><b>${correc}</b>con correcciones</span>`:''}
  </div>`:''}
  ${faltan.length?`<div class="shotlist">
    <h2>Hay que grabar</h2>
    <ul>${faltan.map(t=>{const c=cli(t.clientId);return `<li><span>${esc(t.titulo)}<br><small>${c?esc(c.nombre):''}${est(t.id).nota?' — '+esc(est(t.id).nota):''}</small></span><small>${DIAS_C[t.dia]??''}</small></li>`;}).join('')}</ul>
  </div>`:''}
  ${tareas.length?porDia.map((ts,i)=>ts.length?`
    <div class="day">
      <div class="dayhead ${esEsta&&i===hoyDia?'today':''}"><span>${DIAS[i]}${esEsta&&i===hoyDia?' · hoy':''}</span><small>${ts.length} ${ts.length===1?'video':'videos'}</small></div>
      ${ts.map(taskCard).join('')}
    </div>`:'').join(''):`<div class="empty">No tienes videos asignados esta semana. Cuando Julio te asigne uno, aparece aquí.</div>`}`;
}
function taskCard(t){
  const c=cli(t.clientId);const e=est(t.id);const s=e.estado||'';
  const bloqueado=s==='aprobado';
  return `<article class="task">
    <div class="rail" style="background:${RAIL[s]||'var(--line)'}"></div>
    <div class="body">
      <div class="top">
        <div>
          <h3>${esc(t.titulo)}</h3>
          <div class="meta"><span class="cli"><span class="dot" style="background:${c?c.color:'#555'}"></span>${c?esc(c.nombre):'Cliente'}</span> · ${esc(t.tipo||'Video')}${t.diaPub!=null?' · se publica el '+DIAS[t.diaPub].toLowerCase():''}</div>
        </div>
        ${t.hora!=null?`<span class="time">${fmtHora(t.hora)}</span>`:''}
      </div>
      ${s==='corregir'&&e.notaJulio?`<div class="julio-note"><b>Correcciones de Julio:</b> ${esc(e.notaJulio)}</div>`:''}
      ${e.nota&&s!=='sin_material'?`<div class="my-note">Tu nota: ${esc(e.nota)}</div>`:''}
      ${bloqueado?`<div class="locked">Aprobado por Julio ✓</div>`:`
      <div class="seg" role="group" aria-label="Estado del video">
        ${FLOW.map(x=>`<button data-act="st" data-id="${t.id}" data-s="${x.s}" aria-pressed="${s===x.s}">${x.l}</button>`).join('')}
      </div>`}
      <div class="actions">
        ${c&&c.drive?`<a class="btn ghost sm" href="${esc(c.drive)}" target="_blank" rel="noopener">Abrir carpeta</a>`:''}
        ${t.guion?`<button class="btn ghost sm" data-act="guion" data-id="${t.id}">Ver guion</button>`:''}
        ${!bloqueado?`<button class="btn ghost sm" data-act="nota" data-id="${t.id}">${e.nota?'Editar nota':'Agregar nota'}</button>`:''}
      </div>
    </div>
  </article>`;
}

function rMarcas(){
  const cs=B.clientes||[];
  document.getElementById('v-marcas').innerHTML=`
  <h1>Clientes y Drive</h1>
  <p class="lead">Carpetas de trabajo y la línea de cada marca. Revisa lo que no se hace antes de grabar.</p>
  ${B.driveRoot?`<a class="rootlink" href="${esc(B.driveRoot)}" target="_blank" rel="noopener"><div><b>Drive de clientes</b><span>Branding, crudo, edición, finales y referencias de todos</span></div><span class="btn sm">Abrir</span></a>`:''}
  ${cs.map(c=>{const m=c.marca||{};const rows=[['Giro',c.giro],['Redes',c.redes],['Público',m.publico],['Tono',m.tono],['Colores',m.colores],['Tipografías',m.tipo],['Lo fuerte',m.estrella]].filter(r=>r[1]);
    return `<details class="brand">
      <summary><span class="dot" style="background:${c.color}"></span><b>${esc(c.nombre)}</b><small>${c.drive?'Carpeta lista':'Sin carpeta'}</small></summary>
      <div class="brandbody">
        ${m.desc?`<p style="margin-bottom:10px">${esc(m.desc)}</p>`:''}
        ${rows.length?`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}${m.evitar?`<dt>No hacer</dt><dd class="no">${esc(m.evitar)}</dd>`:''}</dl>`:''}
        ${c.drive?`<a class="btn sm" href="${esc(c.drive)}" target="_blank" rel="noopener">Abrir carpeta de ${esc(c.nombre)}</a>`:'<span class="meta" style="color:var(--muted);font-size:13px">Julio aún no liga la carpeta de este cliente.</span>'}
      </div>
    </details>`;}).join('')||'<div class="empty">Todavía no hay clientes asignados.</div>'}`;
}

function rIdeas(){
  const cs=B.clientes||[];
  const mias=Object.entries(P).filter(([,x])=>x.by===user.email).length;
  document.getElementById('v-ideas').innerHTML=`
  <h1>Ideas IA</h1>
  <p class="lead">Genera ideas por cliente y propón a Julio las que valgan la pena. Él decide cuáles entran al calendario.${mias?` Tienes ${mias} ${mias===1?'propuesta':'propuestas'} esperando respuesta.`:''}</p>
  <div class="field"><label for="i_cli">Cliente</label><select id="i_cli">${cs.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>
  <div class="field"><label for="i_tema">Tema u ocasión (opcional)</label><input id="i_tema" placeholder="Ej. Día de muertos, regreso a clases, temporada de calor"></div>
  <button class="btn" id="i_btn" data-act="gen" style="margin-bottom:18px">Generar 5 ideas</button>
  <div id="ideasOut">${ideas.map(ideaCard).join('')}</div>`;
}
function ideaCard(x,i){
  return `<div class="idea">
    <div class="fmt">${esc(x.formato)}</div>
    <h3>${esc(x.titulo)}</h3>
    <p><b>Gancho:</b> ${esc(x.gancho)}</p>
    <p style="margin-top:4px">${esc(x.descripcion)}</p>
    <div class="actions">
      ${x._sent?'<span class="sent">Propuesta enviada a Julio ✓</span>':`<button class="btn sm" data-act="prop" data-i="${i}">Proponer a Julio</button>`}
      ${x.prompt_imagen?`<button class="btn ghost sm" data-act="copy" data-i="${i}">Copiar prompt de imagen</button>`:''}
    </div>
  </div>`;
}

/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='wk'){weekStart.setDate(weekStart.getDate()+7*Number(b.dataset.n));rSemana();}
  if(a==='st')setEstado(b.dataset.id,b.dataset.s);
  if(a==='nota')openNota(b.dataset.id);
  if(a==='guion')openGuion(b.dataset.id);
  if(a==='gen')genIdeas();
  if(a==='prop')proponer(+b.dataset.i);
  if(a==='copy')copiar(ideas[+b.dataset.i].prompt_imagen||'');
  if(a==='close')closeModal();
  if(a==='saveNota')saveNota(b.dataset.id);
});

async function setEstado(id,s){
  const prev=est(id);
  const data={estado:s,at:Date.now(),by:user.email};
  if(s==='sin_material'&&!prev.nota){openNota(id,true);}
  try{
    await setDoc(doc(db,'equipo','estados'),{e:{[id]:data}},{merge:true});
    toast(FLOW.find(x=>x.s===s).l);
  }catch(err){toast('No se guardó. Revisa tu conexión.');}
}
function openNota(id,faltaGrabar){
  const t=(B.tareas||[]).find(x=>x.id===id);const e=est(id);
  modal(`<h2>${faltaGrabar?'¿Qué falta grabar?':'Nota para Julio'}</h2>
  <p style="color:var(--muted);font-size:14px;margin-bottom:12px">${esc(t?t.titulo:'')}</p>
  <div class="field"><textarea id="n_txt" rows="3" placeholder="${faltaGrabar?'Ej. tomas del producto en tienda, entrevista con el doctor':'Ej. el audio salió con ruido, necesito regrabar'}">${esc(e.nota||'')}</textarea></div>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn ghost" data-act="close">${faltaGrabar?'Después':'Cancelar'}</button>
    <button class="btn" data-act="saveNota" data-id="${id}">Guardar nota</button>
  </div>`);
  setTimeout(()=>document.getElementById('n_txt').focus(),50);
}
async function saveNota(id){
  const v=document.getElementById('n_txt').value.trim();
  try{await setDoc(doc(db,'equipo','estados'),{e:{[id]:{nota:v,at:Date.now(),by:user.email}}},{merge:true});closeModal();toast('Nota guardada');}
  catch(err){toast('No se guardó. Revisa tu conexión.');}
}
function openGuion(id){
  const t=(B.tareas||[]).find(x=>x.id===id);const g=t.guion;const c=cli(t.clientId);
  modal(`<h2>${esc(g.titulo||t.titulo)}</h2>
  <p style="color:var(--muted);font-size:14px">${c?esc(c.nombre):''}${g.dur?' · '+esc(g.dur):''}</p>
  <h4>Hook</h4><p>${esc(g.hook||'—')}</p>
  <h4>Desarrollo</h4><p>${esc(g.des||'—')}</p>
  <h4>Cierre</h4><p>${esc(g.cta||'—')}</p>
  ${g.loc?`<h4>Locación</h4><p>${esc(g.loc)}</p>`:''}
  ${g.props?`<h4>Qué llevar</h4><p>${esc(g.props)}</p>`:''}
  <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-act="close">Cerrar</button></div>`);
}
function modal(h){document.getElementById('modalRoot').innerHTML=`<div class="overlay" data-ov><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.hasAttribute('data-ov'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function genIdeas(){
  const btn=document.getElementById('i_btn');const out=document.getElementById('ideasOut');
  const c=cli(document.getElementById('i_cli').value);const tema=document.getElementById('i_tema').value.trim();
  if(!c)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Generando…';
  try{
    const token=await user.getIdToken();
    const r=await fetch('/api/ideas',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({cliente:{nombre:c.nombre,giro:c.giro,redes:c.redes,marca:c.marca||{}},tema})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'error');
    ideas=j.ideas.map(x=>({...x,_clientId:c.id}));
    out.innerHTML=ideas.map(ideaCard).join('');
  }catch(err){out.innerHTML=`<div class="empty">No se generaron las ideas (${esc(err.message)}). Intenta otra vez en un minuto.</div>`;}
  btn.disabled=false;btn.textContent='Generar 5 ideas';
}
async function proponer(i){
  const x=ideas[i];const id=Math.random().toString(36).slice(2,10);
  try{
    await setDoc(doc(db,'equipo','propuestas'),{p:{[id]:{titulo:x.titulo,formato:x.formato,gancho:x.gancho,descripcion:x.descripcion,prompt_imagen:x.prompt_imagen||'',clientId:x._clientId,at:Date.now(),by:user.email,autor:B.asistente||'Equipo'}}},{merge:true});
    x._sent=true;document.getElementById('ideasOut').innerHTML=ideas.map(ideaCard).join('');toast('Propuesta enviada a Julio');
  }catch(err){toast('No se envió. Revisa tu conexión.');}
}
function copiar(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Prompt copiado')):toast('Copia manualmente');}

/* ---------- auth + datos ---------- */
const lg=document.getElementById('loginScreen');
onAuthStateChanged(auth,u=>{
  unsub.forEach(f=>f());unsub=[];
  if(!u){lg.style.display='flex';return;}
  if(u.email&&u.email.toLowerCase()===OWNER_EMAIL){location.replace('/');return;}
  user=u;lg.style.display='none';
  unsub.push(onSnapshot(doc(db,'equipo','board'),s=>{
    B=s.exists()?s.data():{clientes:[],tareas:[]};
    document.getElementById('whoName').textContent=B.asistente||u.email.split('@')[0];
    render();
  },err=>{document.getElementById('boot').textContent='Tu usuario todavía no tiene acceso al panel. Pídele a Julio que lo active.';}));
  unsub.push(onSnapshot(doc(db,'equipo','estados'),s=>{E=(s.exists()&&s.data().e)||{};if(B&&view==='semana')rSemana();},()=>{}));
  unsub.push(onSnapshot(doc(db,'equipo','propuestas'),s=>{P=(s.exists()&&s.data().p)||{};},()=>{}));
});
async function doLogin(){
  const err=document.getElementById('lg_err');err.textContent='';
  try{await signInWithEmailAndPassword(auth,document.getElementById('lg_email').value.trim(),document.getElementById('lg_pass').value);}
  catch(e){err.textContent=e.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':'No se pudo entrar. Revisa tu conexión.';}
}
document.getElementById('lg_btn').addEventListener('click',doLogin);
document.getElementById('lg_pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('logoutBtn').addEventListener('click',()=>signOut(auth).then(()=>location.reload()));
</script>
